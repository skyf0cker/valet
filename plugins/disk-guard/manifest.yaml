id: disk-guard
bundle_id: com.valet.disk-guard
name: 磁盘守卫
tagline: 监听磁盘可用空间水位并引导安全排查与清理
description: 后台周期检查本机可用磁盘空间并监听 Downloads 大体积安装包到达，需要清理时通过核心安全工具移入废纸篓（7 天可还原）。
version: 1.2.0
source: core
icon: disk
default_installed: true
required_permission: full_disk
required_permission_label: 完全磁盘访问
permissions: [full_disk]
config_schema:
  - key: lowSpaceThresholdPct
    label: 低空间告警阈值（%）
    type: slider
    min: 5
    max: 40
    default: 15
    description: 当磁盘剩余空间低于该百分比时唤醒管家排查
  - key: watchDownloads
    label: 监听 Downloads 安装包（无需完全磁盘访问）
    type: boolean
    default: false
    description: 已授予完全磁盘访问时会自动生效；未授予完全磁盘访问时默认关闭，避免冷启动弹出「下载」文件夹权限窗，可按需手动开启
triggers:
  - id: disk.low_space
    description: 当可用空间低于设定阈值时触发排查
    sensor: script_poll
    script: scripts/poll-disk.mjs
    interval_sec: 60
    policy: auto
  - id: disk.large_file
    description: Downloads 新增较大体积文件或安装包时触发
    sensor: fs_watch
    watch_dirs: [~/Downloads]
    ops: [create]
    glob: "*.dmg"
    policy: ask
